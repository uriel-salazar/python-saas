<!-- Pricing card -->
<div class="price-card">
  <h3 class="price-card-title">{{ object.display_sub_name }}</h3>

  {% if object.display_sub_subtitle %}
    <p class="price-card-subtitle">{{ display_sub_subtitle }}</p>
  {% endif %}

  <div class="price">
    <span class="price-amount">${{ object.price }}</span>
    <span class="price-interval">/{{ object.get_interval_display }}</span>
  </div>

  <ul class="feature-list">
    {% for feature in object.display_features_list %}
      <li class="feature-item">
        <svg class="feature-check" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
        </svg>
        <span>{{ feature }}</span>
      </li>
    {% endfor %}
  </ul>

  <a href="{{ object.get_checkout_url }}" class="plan-button">Select Plan</a>
</div>
